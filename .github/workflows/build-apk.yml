name: Build Android APK

on:
  push:
    branches: ["main", "master"]
    tags: ["v*"]
  pull_request:
    branches: ["main", "master"]
  workflow_dispatch:

jobs:
  build:
    name: Build SLM Play APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Find Gradle project
        id: gradle-project
        shell: bash
        run: |
          if [ -f "./gradlew" ]; then
            echo "path=." >> "$GITHUB_OUTPUT"
          elif [ -f "./app/gradlew" ]; then
            echo "path=./app" >> "$GITHUB_OUTPUT"
          else
            PROJECT=$(find . -maxdepth 3 -type f -name "gradlew" -print -quit)

            if [ -z "$PROJECT" ]; then
              echo "Aucun gradlew trouvé."
              exit 1
            fi

            DIR=$(dirname "$PROJECT")
            echo "path=$DIR" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant Gradle permission
        working-directory: ${{ steps.gradle-project.outputs.path }}
        run: chmod +x ./gradlew

      - name: Clean
        working-directory: ${{ steps.gradle-project.outputs.path }}
        run: ./gradlew clean

      - name: Build Debug APK
        working-directory: ${{ steps.gradle-project.outputs.path }}
        run: ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: SLM-Play-Debug-APK
          path: |
            **/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: SLM Play ${{ github.ref_name }}
          files: |
            **/build/outputs/apk/debug/*.apk
          body: |
            ## SLM Play

            APK Android généré automatiquement.

            Version : ${{ github.ref_name }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}        with:
          name: SLM-Play-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Create GitHub Release with APK (on Tag push)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: app/build/outputs/apk/debug/*.apk
          name: Release ${{ github.ref_name }}
          body: |
            ## SLM Play Android APK
            - Version: ${{ github.ref_name }}
            - Build automatique généré par GitHub Actions.
            - Téléchargez le fichier `.apk` ci-dessous et installez-le sur votre appareil Android.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
