name: Auto Build APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: # Permet de lancer le build manuellement en 1 clic

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout le code
        uses: actions/checkout@v4

      - name: Configurer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Générer la clé de signature automatique
        run: |
          mkdir -p ~/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore debug.keystore

      - name: Rendre gradlew exécutable
        run: chmod +x gradlew

      - name: Compiler l'APK Debug
        run: ./gradlew assembleDebug

      - name: Téléverser l'APK
        uses: actions/upload-artifact@v4
        with:
          name: Mon-APK-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          
